<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Catcher - Daily Fun Game 2026-11-23</title>
<style>
body {
  margin: 0;
  background: #0a0a12;
  color: #00ffff;
  font-family: 'Courier New', monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  overflow: hidden;
}
h1 {
  text-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff;
  margin: 10px 0;
}
#gameCanvas {
  border: 2px solid #00ffff;
  box-shadow: 0 0 20px #00ffff, 0 0 40px #ff00ff;
  background: #050510;
}
#ui {
  display: flex;
  gap: 20px;
  margin: 10px 0;
  font-size: 1.2em;
}
#score, #lives, #highscore {
  text-shadow: 0 0 5px currentColor;
}
button {
  background: transparent;
  border: 2px solid #ff00ff;
  color: #ff00ff;
  padding: 8px 16px;
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 0 10px #ff00ff;
  margin: 5px;
}
button:hover {
  background: rgba(255,0,255,0.2);
}
#message {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 2em;
  text-align: center;
  text-shadow: 0 0 15px #00ffff;
  pointer-events: none;
}
</style>
</head>
<body>
<h1>NEON CATCHER</h1>
<div id="ui">
  <div id="score">Score: 0</div>
  <div id="lives">Lives: 3</div>
  <div id="highscore">High: 0</div>
</div>
<canvas id="gameCanvas" width="600" height="400"></canvas>
<div>
  <button id="startBtn">Start Game</button>
  <button id="restartBtn" style="display:none;">Restart</button>
</div>
<div id="message">Click Start to Play!<br>Catch cyan orbs, dodge red ones.<br>Mouse or Arrow Keys / WASD</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const highEl = document.getElementById('highscore');
const messageEl = document.getElementById('message');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');

let player = { x: 300, y: 350, r: 15, speed: 5 };
let orbs = [];
let particles = [];
let score = 0;
let lives = 3;
let highScore = localStorage.getItem('neonCatcherHigh') || 0;
let gameRunning = false;
let spawnTimer = 0;
let keys = {};

highEl.textContent = `High: ${highScore}`;

function spawnOrb() {
  const isGood = Math.random() > 0.35;
  orbs.push({
    x: Math.random() * (canvas.width - 40) + 20,
    y: -20,
    r: 12 + Math.random() * 8,
    speed: 2 + Math.random() * 2 + score * 0.05,
    good: isGood,
    color: isGood ? '#00ffff' : '#ff0066'
  });
}

function update() {
  if (!gameRunning) return;

  // Player movement
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed;
  player.x = Math.max(player.r, Math.min(canvas.width - player.r, player.x));
  player.y = Math.max(player.r, Math.min(canvas.height - player.r, player.y));

  // Orbs
  spawnTimer++;
  if (spawnTimer > Math.max(20, 60 - score)) {
    spawnOrb();
    spawnTimer = 0;
  }

  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.y += o.speed;
    // Collision
    const dx = player.x - o.x;
    const dy = player.y - o.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < player.r + o.r) {
      if (o.good) {
        score += 10;
        // Particles
        for (let p = 0; p < 8; p++) {
          particles.push({
            x: o.x, y: o.y,
            vx: (Math.random()-0.5)*4,
            vy: (Math.random()-0.5)*4,
            life: 30,
            color: '#00ffff'
          });
        }
      } else {
        lives--;
        for (let p = 0; p < 12; p++) {
          particles.push({
            x: o.x, y: o.y,
            vx: (Math.random()-0.5)*6,
            vy: (Math.random()-0.5)*6,
            life: 40,
            color: '#ff0066'
          });
        }
        if (lives <= 0) {
          gameOver();
        }
      }
      orbs.splice(i, 1);
      continue;
    }
    if (o.y > canvas.height + 30) orbs.splice(i, 1);
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  scoreEl.textContent = `Score: ${score}`;
  livesEl.textContent = `Lives: ${lives}`;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('neonCatcherHigh', highScore);
    highEl.textContent = `High: ${highScore}`;
  }
}

function draw() {
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid lines for neon feel
  ctx.strokeStyle = 'rgba(0,255,255,0.1)';
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 40) {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += 40) {
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
  }

  // Player - neon circle with glow
  ctx.save();
  ctx.shadowBlur = 20;
  ctx.shadowColor = '#00ffff';
  ctx.fillStyle = '#00ffff';
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Orbs
  orbs.forEach(o => {
    ctx.save();
    ctx.shadowBlur = 15;
    ctx.shadowColor = o.color;
    ctx.fillStyle = o.color;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life / 40;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  gameRunning = true;
  score = 0;
  lives = 3;
  orbs = [];
  particles = [];
  player.x = 300;
  player.y = 350;
  messageEl.style.display = 'none';
  startBtn.style.display = 'none';
  restartBtn.style.display = 'none';
  scoreEl.textContent = `Score: 0`;
  livesEl.textContent = `Lives: 3`;
}

function gameOver() {
  gameRunning = false;
  messageEl.innerHTML = `GAME OVER<br>Score: ${score}<br>High: ${highScore}`;
  messageEl.style.display = 'block';
  restartBtn.style.display = 'inline-block';
}

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

canvas.addEventListener('mousemove', e => {
  if (!gameRunning) return;
  const rect = canvas.getBoundingClientRect();
  player.x = e.clientX - rect.left;
  player.y = e.clientY - rect.top;
});

gameLoop();
</script>
</body>
</html>
